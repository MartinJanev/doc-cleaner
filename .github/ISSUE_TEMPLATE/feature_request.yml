name: Feature request
description: Suggest a capability doc-cleaner does not have yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation, not the solution. What are you doing today, and
        where does it break down?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Existing settings, workarounds, or other tools.
